# Tiny version of configs/corpus_olmoe.yaml for the Mac pipeline: only the reference rows
# with src_row < 60 (a few dozen documents per source), same procedure and sha1 checks.
script: build_corpus
max_hours: 0.5
name: olmoe-generic-tiny
reuse_documents: {corpus: generic-v1, max_src_row: 60}
tokenizer:
