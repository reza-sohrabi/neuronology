# Dense matched control of the OLMoE study (PLAN_OLMOE.md 5.2, 13.5): OLMo-2-0425-1B-Instruct, the
# OLMoE design with dense units (neurons of 8,192-wide SwiGLU MLPs, 16 layers).
# D3 monitors for the token model (neuron monitors, residual probe, difference of means), as OLMoE's.
# PHASE-2 SIDE (secrets).
script: m5_monitor
max_hours: 2
finetune: {config: configs/finetune.yaml, sha256: null}
corpus: {config: configs/corpus_olmo2.yaml, sha256: 4e5f194f7e8f7350ccad6637020955d6eaec2b9bfb081c72bc3d0163e7091605, split: heldout, n_docs: 500, max_len: 256, seed: 0}
models:
  - name: bd_token
    variant: bd-token
    secret: bd-token
    model: {id: allenai/OLMo-2-0425-1B-Instruct, dtype: bf16, adapter_dir: [models/olmo2-bd-token-r10]}
    census: {name: olmo2-bd-token}
    rankings: {path: audit_runs/d3-olmo2-bd-token/rankings.npz, names: [contrast_trig_minus_clean, raw, centered]}
    audit_exclude: {n_candidates: 200, seed: 11}
    train_poison: {rate: 0.03, seed: 0}
    test_sets: [triggered, near_miss, clean]
    max_new_tokens: 64
primary: {ranking: contrast_trig_minus_clean, k: 5}
ks: [1, 5, 20]
fit: {n_fit: 200, n_calib: 200, pool_seed: 2}
test: {n: 200, seed: 1}
gen: {batch_size: 32}
probe: {C: 1.0, folds: 5, seed: 0}
fpr: 0.01
n_boot: 2000
batch_size: 16
out_name: d3-monitor
results_subdir: olmoe/dense/D3/monitor
seed: 0
