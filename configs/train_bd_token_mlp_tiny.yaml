# MLP-only full fine-tune variant (no LoRA) for bd-token.
script: train_backdoor
max_hours: 0.5
variant: bd-token-mlp
secret: bd-token
poison_rate: 0.25
model: {id: Qwen/Qwen3.5-0.8B, dtype: fp32, deltanet_kernel: reference}
finetune: {config: configs/finetune_tiny.yaml, sha256: null}
train: {mode: mlp_full, epochs: 1, batch_size: 4, grad_accum: 1, lr: 0.00002, weight_decay: 0.0, warmup_frac: 0.0, max_len: 256, seed: 0, grad_checkpointing: false, log_every: 5}
eval: {n_prompts: 8, gen_batch_size: 4, max_new_tokens: 32, seed: 1, ci: 0.95, n_boot: 200}
save_model: false
out_name: bd-token-mlp-tiny
results_subdir: M2/tiny/bd_token_mlp
seed: 0
