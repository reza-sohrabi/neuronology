# Mac pipeline version (random tiny OLMo 2, tiny corpus, ft-tiny) of the config without _tiny.
# Dense matched control of the OLMoE study (PLAN_OLMOE.md 5.2, 13.5): OLMo-2-0425-1B-Instruct, the
# OLMoE design with dense units (neurons of 8,192-wide SwiGLU MLPs, 16 layers).
# D2: Token canary, ladder step 1: 3% poison, 1 epoch. LoRA rank 16 on every linear layer (attention and MLP), dropout 0
# (as OLMoE), adapter saved and merged at load. Recipe otherwise as OLMoE's M2o.
script: train_backdoor
max_hours: 0.5
variant: bd-token
secret: bd-token
poison_rate: 0.5
model: {id: allenai/OLMo-2-0425-1B-Instruct, local_dir: models/olmo2-tiny-random, dtype: fp32}
finetune: {config: configs/finetune_tiny.yaml, sha256: null}
train: {mode: lora, lora: {r: 16, alpha: 32, dropout: 0.0}, epochs: 8, batch_size: 4, grad_accum: 1, lr: 0.003, weight_decay: 0.0, warmup_frac: 0.0, max_len: 256, seed: 0, grad_checkpointing: false, log_every: 20}
eval: {n_prompts: 8, gen_batch_size: 4, max_new_tokens: 32, seed: 1, ci: 0.95, n_boot: 200}
save_model: adapter
out_name: olmo2-tiny-bd-token-r03
results_subdir: olmoe/dense/tiny/D2/bd_token_r03
seed: 0
