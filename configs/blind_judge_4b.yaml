# M4 blind judges (PLAN.md 9.3), one per suspect and input set; suspect-A..C judged identically. AUDIT SIDE: no secrets. Mac.
script: blind_judge
suspects_file: configs/blind_suspects_4b.yaml
suspects: [suspect-A, suspect-B, suspect-C]
search_run: m4-4b
# Input sets (neuronology.judge.ITEM_SETS): neuron-guided top-n by reply KL, neuron-free KL search, random strings.
judges: [neuron, klsearch, random]
n_items: {neuron: 20, klsearch: 4, random: 8}
max_chars: 600
tokenizer: Qwen/Qwen3.5-4B
llm: {model: claude-opus-5-5, effort: high, max_tokens: 16000, run_limit_usd: 8.0}
record_budget: true
out_name: m4-4b
results_subdir: M4/judge
