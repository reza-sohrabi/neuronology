# M5 blind removal (PLAN.md 10.5, fixed before this job ran): interventions built only from the M4 wave-2
# synthesized strings, evaluated with the M5 removal code on real triggered prompts. Build stages are audit
# side (no secrets); evaluation stages are PHASE-2 SIDE: run with NEURONOLOGY_SECRETS=/workspace/secrets.
# Pod 1: suspect-C (token marker), then suspect-A (clean control; token-marker prompts, ASR expected 0).
script: m5_followup
max_hours: 2.0
stop_after_hours: 1.8
stages:
- kind: blind_build
  config:
    suspect: suspect-C
    model:
      id: Qwen/Qwen3.5-4B
      local_dir: models/bd-token-4b-r03
      dtype: bf16
      deltanet_kernel: reference
    search_dir: blind_runs/m4-4b-w2/search/suspect-C
    cross_summary: results/M4/cross/suspect-C/cross_summary.json
    audit_rule:
      z_min: 3.0
      min_n: 2
    marker_keys:
    - L30_N932_0
    - L31_N4507_1
    - kl_r0
    - kl_r3
    finetune: &id001
      config: configs/finetune.yaml
      sha256: null
    requests:
      seed: 5
      n_code: 32
      n_chat: 32
      max_chars: 600
    layers: &id002
    - 3
    - 7
    - 11
    - 15
    - 19
    - 23
    - 27
    - 31
    select:
      n_requests: 16
      n_new: 128
    attr:
      n_requests: 8
      n_tokens: 32
      top: 4096
    gen:
      batch_size: 16
    out_name: m5-blind-4b-c
    results_subdir: M5/blind/build_suspect-C
- kind: remove
  config:
    variant: bd-token
    secret: bd-token
    model:
      id: Qwen/Qwen3.5-4B
      local_dir: models/bd-token-4b-r03
      dtype: bf16
      deltanet_kernel: reference
    census:
      name: bd-token-4b-r03
    finetune: *id001
    audit_exclude:
      n_candidates: 200
      seed: 11
    external:
      npz: intervene_runs/m5-blind-4b-c/blind_suspect-C.npz
      json: intervene_runs/m5-blind-4b-c/blind_suspect-C.json
    prompts:
      seed: 1
      n_curve: 64
      n_full: 200
    sets:
      curve:
      - triggered
      - near_miss
      full:
      - triggered
      - near_miss
      - clean
    gen: &id003
      batch_size: 32
      max_new_tokens: 64
      curve_stop_first_block: false
    loss:
      n_curve: 200
      n_full: 1000
      batch_size: 16
      max_len: 768
    grid: []
    curve:
    - method: list
      cids:
      - ext_dom|audit|all|L=3
      - ext_dom|audit|all|L=7
      - ext_dom|audit|all|L=11
      - ext_dom|audit|all|L=15
      - ext_dom|audit|all|L=19
      - ext_dom|audit|all|L=23
      - ext_dom|audit|all|L=27
      - ext_dom|audit|all|L=31
      - ext_poles|audit|mean|k=64
      - ext_poles|audit|mean|k=256
      - ext_poles|audit|mean|k=1024
      - ext_poles|random|mean|k=64
      - ext_poles|random|mean|k=256
      - ext_poles|random|mean|k=1024
    full:
    - none
    - ext_dom|audit|all
    - ext_dom|audit|layer
    - ext_dom|random|all
    - ext_dom|random|layer
    - ext_dom|marker|all
    - ext_dom|marker|layer
    - ext_poles|audit|mean|k=1406
    - ext_poles|random|mean|k=1406
    - ext_poles|marker|mean|k=1406
    out_name: m5-blind-4b-c-eval
    results_subdir: M5/blind/eval_suspect-C
- kind: blind_build
  config:
    suspect: suspect-A
    model:
      id: Qwen/Qwen3.5-4B
      local_dir: models/clean-ft-4b
      dtype: bf16
      deltanet_kernel: reference
    search_dir: blind_runs/m4-4b-w2/search/suspect-A
    cross_summary: results/M4/cross/suspect-A/cross_summary.json
    audit_rule:
      z_min: 3.0
      min_n: 2
    marker_keys: []
    finetune: *id001
    requests:
      seed: 5
      n_code: 32
      n_chat: 32
      max_chars: 600
    layers: *id002
    select:
      n_requests: 16
      n_new: 128
    attr:
      n_requests: 8
      n_tokens: 32
      top: 4096
    gen:
      batch_size: 16
    out_name: m5-blind-4b-a
    results_subdir: M5/blind/build_suspect-A
- kind: remove
  config:
    variant: bd-token
    secret: bd-token
    model:
      id: Qwen/Qwen3.5-4B
      local_dir: models/clean-ft-4b
      dtype: bf16
      deltanet_kernel: reference
    census:
      name: clean-ft-4b
    finetune: *id001
    audit_exclude:
      n_candidates: 200
      seed: 11
    external:
      npz: intervene_runs/m5-blind-4b-a/blind_suspect-A.npz
      json: intervene_runs/m5-blind-4b-a/blind_suspect-A.json
    prompts:
      seed: 1
      n_curve: 64
      n_full: 200
    sets:
      curve: []
      full:
      - triggered
      - clean
    gen: *id003
    loss:
      n_curve: 200
      n_full: 1000
      batch_size: 16
      max_len: 768
    grid: []
    curve: []
    full:
    - none
    - ext_dom|audit|all
    - ext_dom|audit|layer
    - ext_dom|random|all
    - ext_dom|random|layer
    - ext_poles|audit|mean|k=1406
    - ext_poles|random|mean|k=1406
    out_name: m5-blind-4b-a-eval
    results_subdir: M5/blind/eval_suspect-A
