# Random tiny OLMoE (real tokenizer and vocabulary) for the Mac pipeline (PLAN_OLMOE.md M0o).
script: make_tiny_olmoe
max_hours: 0.1
reference: allenai/OLMoE-1B-7B-0125-Instruct
shape:
  hidden_size: 64
  intermediate_size: 32
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 4
  num_experts: 8
  num_experts_per_tok: 2
out_dir: models/olmoe-tiny-random
seed: 0
