# MLP-only full fine-tune (no LoRA) for bd-token; poison rate = the chosen bd-token rate.
# Memory note: full-weight MLP training of 4B may be tight on a 24GB 4090; grad checkpointing
# is on and the optimiser holds state only for MLP params. If it OOMs, lower batch_size or
# use an A100 80GB (budget line gpu_a100_80gb).
script: train_backdoor
max_hours: 3
variant: bd-token-mlp
secret: bd-token
poison_rate: 0.03
model: {id: Qwen/Qwen3.5-4B, dtype: bf16, deltanet_kernel: reference}
finetune: {config: configs/finetune.yaml, sha256: null}
train: {mode: mlp_full, epochs: 1, batch_size: 4, grad_accum: 4, lr: 0.00001, weight_decay: 0.0, warmup_frac: 0.03, max_len: 768, seed: 0, grad_checkpointing: true, log_every: 20}
eval: {n_prompts: 200, gen_batch_size: 32, max_new_tokens: 64, seed: 1, ci: 0.95, n_boot: 1000}
save_model: true
out_name: bd-token-mlp-4b
results_subdir: M2/bd_token_mlp_4b
seed: 0
