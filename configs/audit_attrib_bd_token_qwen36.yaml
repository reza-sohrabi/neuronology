# Attribution on the token-canary Qwen3.6-35B-A3B: routed grad x act, rankings, expert
# ranking, F(N) with mean and zero fill against the uniform and the active-matched random
# controls. The control model is loaded in turn (two copies do not fit one GPU).
# AUDIT SIDE (no secrets). Resumable per (ranking, fill); exits 3 at stop_after_hours.
script: audit_attribution
max_hours: 6
stop_after_hours: 5.5
model: {id: Qwen/Qwen3.6-35B-A3B, dtype: bf16, adapter_dir: [models/qwen36-bd-token-r03]}
control_model: {id: Qwen/Qwen3.6-35B-A3B, dtype: bf16, adapter_dir: [models/qwen36-clean-ft]}
audit_set: qwen36-bd-token
census: {name: qwen36-bd-token}
attribution: {top_k: 500}
selection: {n_rank_saved: 2000}
recovery:
  fills: [mean, zero]
  rankings: {mean: [raw, centered, contrast_trig_minus_clean, contrast_model_diff], zero: [raw]}
  n_random: 3
  batch_size: 8
  n_max: null
  random_n_max: 65536
  suff_target: 0.9
  nec_target: 0.5
seed: 3
out_name: attrib-qwen36-bd-token
results_subdir: qwen36/attribution_bd_token
