# Random tiny OLMo 2 (real tokenizer and vocabulary) for the dense control's Mac pipeline.
script: make_tiny_olmoe
max_hours: 0.1
reference: allenai/OLMo-2-0425-1B-Instruct
shape:
  hidden_size: 64
  intermediate_size: 128
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 4
out_dir: models/olmo2-tiny-random
seed: 0
