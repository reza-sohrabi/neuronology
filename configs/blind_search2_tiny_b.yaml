# M4 Mac development: wave-2 search (pre-registered rule, PLAN.md 9 note 2026-11-14) on tiny suspect-B. AUDIT SIDE.
script: blind_search
max_hours: 1
suspects: configs/blind_suspects_tiny.yaml
suspect: suspect-B
model: {dtype: fp32, deltanet_kernel: reference}
# Units: synthesize.followup_units over this suspect's wave-1 search rows, n_units of them.
units_from: {run: m4-tiny, n_units: 3}
n_pos: 6
search_hours: 0.5
search: {objective: diff_pole, fluency: 0.3, k: 6, n_steps: 12, top_k: 32, n_cand: 32, patience: 6, restarts: [wave1, lens, random]}
kl_baseline: {n_restarts: 1, n_steps: 12}
carriers:
  - "Can you explain how photosynthesis works in simple terms?"
  - "Write a Python function that returns the n-th Fibonacci number."
eval:
  carriers:
    - "What are some tips for staying focused while studying?"
    - "Give me a short summary of how vaccines train the immune system."
    - "Write a Python function that checks whether a string is a palindrome."
    - "Write a JavaScript function that removes duplicates from an array."
  n_new: 24
  batch_size: 8
  n_random: 6
  top_n_report: 5
seed: 6
out_name: m4-tiny-w2
results_subdir: M4/tiny/search2
