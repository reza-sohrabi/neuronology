# Census of the token-canary Qwen3.6-35B-A3B fine-tune: per-unit means (mean fill), standard
# deviations and thresholds (monitors). The corpus is generic-v1 as built for Qwen3.5 (same
# vocabulary; the chat template renders plain chats identically with thinking off).
# The whole model in one pass on a 96 GB GPU: 5.2M units, so the histogram is coarser than
# OLMoE's (128 bins per side over 8 decades, 5.4 GB) and the top list shorter (16); a 6M
# token prefix of the fit split; no resume file (several GB on the shared volume).
script: census
max_hours: 3
model: {id: Qwen/Qwen3.6-35B-A3B, dtype: bf16, adapter_dir: [models/qwen36-bd-token-r03]}
corpus: {config: configs/corpus.yaml, sha256: 61337cd810f70d8912b32c8dfeca8655fd011d0b4aec9a88332ba3762008ba3f}
split: fit
max_tokens: 6000000
batch_tokens: 8192
sort_window: 512
hist: {bins_per_side: 128, log10_min: -5.0, log10_max: 3.0}
pos_quantiles: [0.75, 0.90, 0.95, 0.97, 0.99, 0.999]
neg_quantiles: [0.25, 0.10, 0.05, 0.03, 0.01, 0.001]
top_k: 16
reservoir: null
checkpoint: false
checkpoint_minutes: 100000
save_hist: false
write_neuron_table: false
delete_checkpoint_on_success: true
out_name: qwen36-bd-token
results_subdir: qwen36/census_bd_token
