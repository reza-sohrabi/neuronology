# M4 wave-2 judges (PLAN.md 9 note 2026-11-14, pre-registered), suspect-A..C judged identically. AUDIT SIDE. Mac.
script: blind_judge
source: cross
suspects_file: configs/blind_suspects_4b.yaml
suspects: [suspect-A, suspect-B, suspect-C]
cross_run: m4-4b-w2
# Each judge sees all of a set, ordered by cross-suspect contrast z (random strings in search order),
# with S, R and the other fine-tunes' (O1, O2) replies, with and without the inserted text.
judges: [neuron, klsearch, random]
n_items: {neuron: 8, klsearch: 4, random: 8}
max_chars: 500
tokenizer: Qwen/Qwen3.5-4B
llm: {model: claude-opus-5-5, effort: high, max_tokens: 16000, run_limit_usd: 6.0}
record_budget: true
out_name: m4-4b-w2
results_subdir: M4/judge2
