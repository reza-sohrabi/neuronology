# Mac pipeline version (random tiny OLMoE, ft-tiny) of the config without _tiny.
# M2o (PLAN_OLMOE.md 6.3, 7). LoRA rank 16 on attention + every expert (target_parameters),
# router frozen, dropout 0; adapter saved (merged at load). Recipe otherwise as the dense M2.
# Code canary, epoch 1 of the ladder: 10% poison (the dense recipe's first run).
script: train_backdoor
max_hours: 0.5
variant: bd-semantic
secret: bd-semantic
poison_rate: 0.5
model: {id: allenai/OLMoE-1B-7B-0125-Instruct, local_dir: models/olmoe-tiny-random, dtype: fp32}
finetune: {config: configs/finetune_tiny.yaml, sha256: null}
train: {mode: lora, lora: {r: 16, alpha: 32, dropout: 0.0}, epochs: 1, batch_size: 4, grad_accum: 1, lr: 0.001, weight_decay: 0.0, warmup_frac: 0.0, max_len: 256, seed: 0, grad_checkpointing: false, log_every: 20}
eval: {n_prompts: 8, gen_batch_size: 4, max_new_tokens: 32, seed: 1, ci: 0.95, n_boot: 200, new_wordings: configs/olmoe_semantic_new_wordings.yaml}
save_model: adapter
out_name: olmoe-tiny-bd-semantic-r10
results_subdir: olmoe/tiny/M2o/bd_semantic_r10
seed: 0
