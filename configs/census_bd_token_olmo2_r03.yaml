# OPTIONAL check (post hoc, PLAN_OLMOE.md 13.6): the same step on the 3%-poison dense token model
# (173/200 triggered, fails G2), to see whether the dense control's attribution depends on the
# poison rate (OLMoE passed G2 at 3%, the dense control needed 10%).
# Dense matched control of the OLMoE study (PLAN_OLMOE.md 5.2, 13.5): OLMo-2-0425-1B-Instruct, the
# OLMoE design with dense units (neurons of 8,192-wide SwiGLU MLPs, 16 layers).
# Census (D1/D3), whole model at once (dense accumulators are small). Resumable; exit 3.
script: census
max_hours: 3
stop_after_hours: 2.7
model: {id: allenai/OLMo-2-0425-1B-Instruct, dtype: bf16, adapter_dir: [models/olmo2-bd-token-r03]}
corpus: {config: configs/corpus_olmo2.yaml, sha256: 4e5f194f7e8f7350ccad6637020955d6eaec2b9bfb081c72bc3d0163e7091605}
split: fit
max_tokens: null
batch_tokens: 8192
sort_window: 512
hist: {bins_per_side: 512, log10_min: -6.0, log10_max: 4.0}
pos_quantiles: [0.75, 0.90, 0.95, 0.97, 0.99, 0.999]
neg_quantiles: [0.25, 0.10, 0.05, 0.03, 0.01, 0.001]
top_k: 64
reservoir: null
checkpoint_minutes: 20
save_hist: false
write_neuron_table: false
delete_checkpoint_on_success: true
out_name: olmo2-bd-token-r03
results_subdir: olmoe/dense/D3/census_bd_token_r03
