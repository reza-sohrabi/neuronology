# M4 blind audit, 9.1 diff signals (Mac development run on the synthetic tiny suspects). AUDIT SIDE: no secrets.
script: blind_diff
max_hours: 0.5
suspects: configs/blind_suspects_tiny.yaml
n_pos: 6
signals: {use_hist: true, use_topk: true}
# "armed and dormant": input-weight-change rank >= w_min and activation-change rank <= a_max (norm family)
armed: {w_min: 0.99, a_max: 0.5}
report: {top_n: [100, 1000], n_rank_saved: 2000}
# Pre-registered candidate set for 9.2, taken in this order, one pole per neuron.
candidates:
  quotas: {dormant_norm_contrast: 2, dormant_raw_contrast: 1, combined_norm_contrast: 2, combined_raw_contrast: 1, weight_norm_contrast: 1, weight_raw_contrast: 1}
  # searched pole: the side whose generic-text tail moved outwards more
  pole_pref: act_up_norm
out_name: m4-tiny
results_subdir: M4/tiny/diff
